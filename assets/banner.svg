<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- subtle circuit-style grid lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.6">
    <path d="M0 40 H260 L300 80 H1200"/>
    <path d="M0 180 H180 L220 140 H500 L540 180 H1200"/>
    <path d="M120 0 V40"/>
    <path d="M300 80 V0"/>
    <path d="M220 140 V220"/>
    <path d="M540 180 V220"/>
  </g>
  <g fill="#38BDF8" opacity="0.9">
    <circle cx="120" cy="40" r="3.5"/>
    <circle cx="300" cy="80" r="3.5"/>
    <circle cx="220" cy="140" r="3.5"/>
    <circle cx="540" cy="180" r="3.5"/>
  </g>

  <!-- main title -->
  <text x="600" y="105" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700"
        fill="url(#titleFade)" text-anchor="middle" letter-spacing="4">NENSI BATRA</text>

  <!-- accent divider -->
  <rect x="450" y="130" width="300" height="2.5" fill="url(#accentLine)"/>

  <!-- subtitle -->
  <text x="600" y="165" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400"
        fill="#94A3B8" text-anchor="middle" letter-spacing="1">Software Engineer &#183; AI &amp; Full-Stack Systems</text>

  <!-- location tag -->
  <text x="600" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400"
        fill="#64748B" text-anchor="middle" letter-spacing="0.5">Karachi, Pakistan</text>
</svg>
