name: metrics
on:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Nensibatra1122
          template: classic
          base: header, activity, community, repositories, metadata

          # --- Theme: match README's dark + blue accent palette ---
          config_timezone: Asia/Karachi
          config_display: large
          config_base_color: 3B82F6
          config_output: svg

          # Overrides so the card's background/text match your README instead
          # of the GitHub default light/dark theme
          style: >-
            .card{background:#0F172A;}
            .octicon,.icon{fill:#3B82F6 !important;}
            [fill="#586069"],[fill="#959da5"]{fill:#94A3B8 !important;}
            [stroke="#e1e4e8"]{stroke:#1E293B !important;}

          # --- Sections that animate/refresh on load ---
          plugin_lines: yes
          plugin_lines_sections: base, extra
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_load: 300
          plugin_activity_visibility: all
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_colors: github
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
